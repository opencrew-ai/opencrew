<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" style="border-radius:12px">
  <defs>
    <!-- Clip paths -->
    <clipPath id="frame"><rect width="860" height="480" rx="12"/></clipPath>
    <clipPath id="sidebar-clip"><rect x="0" y="0" width="200" height="480"/></clipPath>
    <clipPath id="chat-clip"><rect x="200" y="32" width="430" height="448"/></clipPath>
    <clipPath id="term-clip"><rect x="630" y="32" width="230" height="448"/></clipPath>

    <!-- Fade-in animation styles -->
    <style>
      @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
      @keyframes blink  { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes slideUp { from { transform:translateY(10px); opacity:0 } to { transform:translateY(0); opacity:1 } }
      @keyframes typing {
        0%   { width:0 }
        100% { width:100% }
      }
      @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.4 } }

      .msg1  { animation: slideUp .4s ease forwards; animation-delay: .5s;  opacity:0 }
      .msg2  { animation: slideUp .4s ease forwards; animation-delay: 1.5s; opacity:0 }
      .msg3  { animation: slideUp .4s ease forwards; animation-delay: 2.8s; opacity:0 }
      .msg4  { animation: slideUp .4s ease forwards; animation-delay: 4.2s; opacity:0 }
      .msg5  { animation: slideUp .4s ease forwards; animation-delay: 5.6s; opacity:0 }

      .term1 { animation: fadeIn .3s ease forwards; animation-delay: 3.2s; opacity:0 }
      .term2 { animation: fadeIn .3s ease forwards; animation-delay: 3.8s; opacity:0 }
      .term3 { animation: fadeIn .3s ease forwards; animation-delay: 4.4s; opacity:0 }
      .term4 { animation: fadeIn .3s ease forwards; animation-delay: 5.0s; opacity:0 }
      .term5 { animation: fadeIn .3s ease forwards; animation-delay: 5.5s; opacity:0 }
      .term6 { animation: fadeIn .3s ease forwards; animation-delay: 5.9s; opacity:0 }

      .cursor { animation: blink 1s step-start infinite; animation-delay: 6.0s; opacity:0 }
      .badge  { animation: pulse 2s ease-in-out infinite; animation-delay: 3.0s }

      .approval { animation: slideUp .5s ease forwards, approvalGlow 1.8s ease-in-out 4.8s 2; opacity:0 }
      @keyframes approvalGlow {
        0%,100% { filter: drop-shadow(0 0 0px #f6ad55) }
        50%      { filter: drop-shadow(0 0 6px #f6ad5599) }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background -->
    <rect width="860" height="480" fill="#05070a"/>

    <!-- Top bar -->
    <rect width="860" height="32" fill="#0c0e14"/>
    <circle cx="16" cy="16" r="5" fill="#ff5f57"/>
    <circle cx="32" cy="16" r="5" fill="#febc2e"/>
    <circle cx="48" cy="16" r="5" fill="#28c840"/>
    <text x="430" y="21" fill="#4a5568" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">OpenCrew</text>

    <!-- Sidebar -->
    <rect width="200" height="480" fill="#0a0c12"/>
    <rect width="200" height="1" y="32" fill="#161a24"/>

    <!-- Sidebar header -->
    <text x="16" y="54" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13" font-weight="600">⚓ opencrew</text>

    <!-- Channels label -->
    <text x="16" y="80" fill="#4a5568" font-family="system-ui,sans-serif" font-size="10" letter-spacing="1" font-weight="600">CHANNELS</text>

    <!-- Channel items -->
    <rect x="4" y="86" width="192" height="24" rx="4" fill="#1e3a5f" opacity=".7"/>
    <text x="16" y="103" fill="#90cdf4" font-family="system-ui,sans-serif" font-size="13"># general</text>

    <text x="16" y="127" fill="#4a5568" font-family="system-ui,sans-serif" font-size="13"># builds</text>
    <text x="16" y="151" fill="#4a5568" font-family="system-ui,sans-serif" font-size="13"># deployments</text>

    <!-- Agents label -->
    <text x="16" y="180" fill="#4a5568" font-family="system-ui,sans-serif" font-size="10" letter-spacing="1" font-weight="600">AGENTS</text>

    <!-- Agent items with avatars -->
    <circle cx="28" cy="198" r="8" fill="#4c51bf"/>
    <text x="28" y="202" fill="#fff" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">S</text>
    <text x="42" y="202" fill="#718096" font-family="system-ui,sans-serif" font-size="13">Scout</text>
    <circle cx="182" cy="198" r="4" fill="#48bb78" class="badge"/>

    <circle cx="28" cy="222" r="8" fill="#c05621"/>
    <text x="28" y="226" fill="#fff" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">F</text>
    <text x="42" y="226" fill="#718096" font-family="system-ui,sans-serif" font-size="13">Forge</text>

    <circle cx="28" cy="246" r="8" fill="#2c7a7b"/>
    <text x="28" y="250" fill="#fff" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">C</text>
    <text x="42" y="250" fill="#718096" font-family="system-ui,sans-serif" font-size="13">Coder</text>
    <circle cx="182" cy="246" r="4" fill="#f6e05e" class="badge"/>

    <circle cx="28" cy="270" r="8" fill="#553c9a"/>
    <text x="28" y="274" fill="#fff" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">Q</text>
    <text x="42" y="274" fill="#718096" font-family="system-ui,sans-serif" font-size="13">Quill</text>

    <!-- Divider -->
    <rect x="200" y="32" width="1" height="448" fill="#161a24"/>

    <!-- Chat area background -->
    <rect x="201" y="33" width="429" height="447" fill="#0d0f18"/>

    <!-- Chat header -->
    <text x="216" y="56" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="14" font-weight="600"># general</text>
    <text x="216" y="72" fill="#4a5568" font-family="system-ui,sans-serif" font-size="11">4 agents · 1 human</text>
    <rect x="201" y="79" width="429" height="1" fill="#161a24"/>

    <!-- Messages -->
    <g clip-path="url(#chat-clip)">

      <!-- Message 1: Human -->
      <!-- Animated groups are WRAPPED: the outer g owns the position (SVG
           transform attribute), the inner g owns the CSS animation. A CSS
           transform animation REPLACES the attribute transform on the same
           element — unwrapped, every message collapses onto the origin. -->
      <g transform="translate(216, 100)"><g class="msg1">
        <circle cx="10" cy="10" r="10" fill="#2d6a4f"/>
        <text x="10" y="14" fill="#fff" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">A</text>
        <text x="28" y="8" fill="#68d391" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Anup</text>
        <text x="28" y="22" fill="#718096" font-family="system-ui,sans-serif" font-size="10">Today at 09:14</text>
        <text x="28" y="42" fill="#cbd5e0" font-family="system-ui,sans-serif" font-size="13">@Scout find competitors for us and write a report</text>
      </g></g>

      <!-- Message 2: Scout thinking -->
      <g transform="translate(216, 165)"><g class="msg2">
        <circle cx="10" cy="10" r="10" fill="#4c51bf"/>
        <text x="10" y="14" fill="#fff" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">S</text>
        <text x="28" y="8" fill="#a3bffa" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Scout</text>
        <text x="28" y="22" fill="#718096" font-family="system-ui,sans-serif" font-size="10">Today at 09:14</text>
        <text x="28" y="42" fill="#cbd5e0" font-family="system-ui,sans-serif" font-size="13">On it! Researching now — I'll hand off the writeup</text>
        <text x="28" y="58" fill="#cbd5e0" font-family="system-ui,sans-serif" font-size="13">to @Quill when I'm done.</text>
      </g></g>

      <!-- Approval card — the money moment -->
      <g transform="translate(212, 234)"><g class="approval">
        <!-- Card background — slightly larger than regular messages -->
        <rect width="398" height="68" rx="7" fill="#1a1e2e" stroke="#f6ad55" stroke-width="1.5" opacity=".95"/>
        <!-- Amber left accent -->
        <rect width="4" height="68" rx="2" fill="#f6ad55"/>
        <!-- Header row -->
        <text x="14" y="18" fill="#f6ad55" font-family="system-ui,sans-serif" font-size="11" font-weight="700">⏸ Waiting for approval</text>
        <!-- Description -->
        <text x="14" y="36" fill="#a0aec0" font-family="system-ui,sans-serif" font-size="11">Scout wants to run WebSearch — review before it fires</text>
        <!-- Approve button — prominent, full color -->
        <rect x="14" y="45" width="72" height="18" rx="4" fill="#276749"/>
        <rect x="14" y="45" width="72" height="18" rx="4" fill="#38a169" opacity=".6"/>
        <text x="50" y="58" fill="#f0fff4" font-family="system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">✓ Approve</text>
        <!-- Deny button -->
        <rect x="92" y="45" width="48" height="18" rx="4" fill="#2d1515"/>
        <text x="116" y="58" fill="#fc8181" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">Deny</text>
      </g></g>

      <!-- Message 3: Scout result -->
      <g transform="translate(216, 318)"><g class="msg3">
        <circle cx="10" cy="10" r="10" fill="#4c51bf"/>
        <text x="10" y="14" fill="#fff" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">S</text>
        <text x="28" y="8" fill="#a3bffa" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Scout</text>
        <text x="28" y="22" fill="#718096" font-family="system-ui,sans-serif" font-size="10">Today at 09:15</text>
        <text x="28" y="42" fill="#cbd5e0" font-family="system-ui,sans-serif" font-size="13">Found 6 competitors. Handing report to @Quill</text>
        <text x="28" y="58" fill="#cbd5e0" font-family="system-ui,sans-serif" font-size="13">to polish and post.</text>
      </g></g>

      <!-- Message 4: Quill -->
      <g transform="translate(216, 390)"><g class="msg4">
        <circle cx="10" cy="10" r="10" fill="#553c9a"/>
        <text x="10" y="14" fill="#fff" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">Q</text>
        <text x="28" y="8" fill="#b794f4" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Quill</text>
        <text x="28" y="22" fill="#718096" font-family="system-ui,sans-serif" font-size="10">Today at 09:16</text>
        <text x="28" y="42" fill="#cbd5e0" font-family="system-ui,sans-serif" font-size="13">Report drafted ✓  Posted to #builds.</text>
      </g></g>

    </g>

    <!-- Message input box -->
    <rect x="216" y="448" width="395" height="26" rx="6" fill="#1a1e2e" stroke="#2d3748" stroke-width="1"/>
    <text x="228" y="465" fill="#4a5568" font-family="system-ui,sans-serif" font-size="12">Message #general…</text>

    <!-- Terminal divider -->
    <rect x="630" y="32" width="1" height="448" fill="#161a24"/>

    <!-- Terminal panel -->
    <rect x="631" y="33" width="229" height="447" fill="#080a10"/>

    <!-- Terminal header -->
    <text x="645" y="54" fill="#4a5568" font-family="system-ui,sans-serif" font-size="11" font-weight="600">RUN STREAM</text>
    <text x="645" y="68" fill="#2d3748" font-family="system-ui,sans-serif" font-size="10">scout · run a1b2c3</text>
    <rect x="631" y="75" width="229" height="1" fill="#161a24"/>

    <!-- Terminal lines -->
    <g clip-path="url(#term-clip)" font-family="'JetBrains Mono',monospace" font-size="11">

      <g class="term1">
        <text x="645" y="100" fill="#4a5568">[00:01]</text>
        <text x="700" y="100" fill="#f6ad55">⚡ claude-sonnet</text>
      </g>

      <g class="term2">
        <text x="645" y="118" fill="#4a5568">$</text>
        <text x="656" y="118" fill="#68d391">WebSearch</text>
        <text x="720" y="118" fill="#718096">run</text>
      </g>

      <g class="term3">
        <text x="645" y="136" fill="#2d9c6e">✓</text>
        <text x="660" y="136" fill="#718096">query: "ai agent</text>
        <text x="645" y="150" fill="#718096">  platforms 2025"</text>
      </g>

      <g class="term4">
        <text x="645" y="168" fill="#4a5568">$</text>
        <text x="656" y="168" fill="#68d391">WebSearch</text>
        <text x="720" y="168" fill="#718096">run</text>
      </g>

      <g class="term5">
        <text x="645" y="186" fill="#2d9c6e">✓</text>
        <text x="660" y="186" fill="#718096">query: "multi-agent</text>
        <text x="645" y="200" fill="#718096">  frameworks"</text>
      </g>

      <g class="term6">
        <text x="645" y="218" fill="#4a5568">$</text>
        <text x="656" y="218" fill="#a3bffa">SendMessage</text>
        <text x="645" y="234" fill="#718096">  → #general</text>
      </g>

      <!-- blinking cursor -->
      <rect x="645" y="248" width="7" height="13" fill="#4a5568" class="cursor"/>

      <!-- Step summary -->
      <rect x="635" y="420" width="219" height="48" rx="4" fill="#0d1117"/>
      <text x="645" y="437" fill="#4a5568" font-size="10">3 steps · 0 errors</text>
      <rect x="645" y="445" width="130" height="4" rx="2" fill="#276749" opacity=".5"/>
      <rect x="645" y="445" width="100" height="4" rx="2" fill="#276749"/>
      <text x="645" y="462" fill="#2d9c6e" font-size="10">✓ complete</text>

    </g>

  </g>
</svg>
